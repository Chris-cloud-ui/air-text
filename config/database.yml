default: &default
  adapter: postgresql
  url: <%= ENV["DATABASE_URL"] %>
  encoding: unicode
  template: template0
  pool: <%= Integer(ENV.fetch('RAILS_MAX_THREADS') { 5 }) %>

development:
  database: air-text_development
  <<: *default

test:
  database: air-text_test
  <<: *default

production:
  <<: *default
